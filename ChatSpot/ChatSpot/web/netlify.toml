[build]
  
  # Command runs INSIDE the base directory
  command = "npm install && npm run build"
  
  # Publish directory is relative to the BASE directory
  # If your build creates a 'dist' folder inside 'web', just use "dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  # This fixes the 404 on refresh for SPAs
  from = "/*"
  to = "/index.html"
  status = 200